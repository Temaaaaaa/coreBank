spring:
  application:
    name: corebank-lite
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/corebank}"
    username: ${DB_USERNAME:corebank}
    password: ${DB_PASSWORD:corebank_dev}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
